[package]
name = "gengis-mimi"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "An object-storage-backed document and vector database built with SlateDB"
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = "0.8"
crc32fast = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slatedb = "=0.16.0"
slatedb-common = "=0.16.0"
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
