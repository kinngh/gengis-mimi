# Workers sharing a shard use the same storage prefix and separate caches.
[server]
bind = "127.0.0.1:8783"
[storage]
type = "s3"
bucket = "gengis-mimi"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"
allow_http = true

[database]
prefix = "gengis-mimi/cluster/shard-b"
cache_dir = "./.cache/worker-b"

[cluster]
role = "worker"
node_id = "worker-b"
lease_ms = 9000
