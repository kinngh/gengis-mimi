[server]
bind = "127.0.0.1:8780"
[storage]
type = "s3"
bucket = "gengis-mimi"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"
allow_http = true

[database]
# Stores the immutable placement map; no SlateDB writer opens here.
prefix = "gengis-mimi/cluster/gateway"

[cluster]
role = "gateway"
upstream_token_env = "GENGIS_MIMI_CLUSTER_TOKEN"

[[cluster.shards]]
id = "a"
workers = ["http://127.0.0.1:8781", "http://127.0.0.1:8782"]

[[cluster.shards]]
id = "b"
workers = ["http://127.0.0.1:8783"]
