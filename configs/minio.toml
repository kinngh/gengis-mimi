# Create the bucket first; credentials come from the environment.
[server]
bind = "127.0.0.1:7878"
max_concurrent_queries = 4

[storage]
type = "s3"
bucket = "gengis-mimi"
region = "us-east-1"
endpoint = "http://127.0.0.1:9000"
allow_http = true

[database]
prefix = "gengis-mimi/v1"
wal_flush_ms = 100
cache_dir = "./.cache/minio"
cache_bytes = 536870912
